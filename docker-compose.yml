# Локальное окружение разработки: `make up`
services:
  db:
    build: ./infra/postgres
    image: afisha-postgres:18
    environment:
      POSTGRES_USER: afisha
      POSTGRES_PASSWORD: afisha
      POSTGRES_DB: afisha
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB", "-c", "max_connections=60"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afisha"]
      interval: 3s
      retries: 20
    mem_limit: 768m
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["56379:6379"]
    mem_limit: 128m
volumes:
  pgdata:
