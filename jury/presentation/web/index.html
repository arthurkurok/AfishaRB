<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Афиша РБ</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f6f3; }
body { user-select: none; -webkit-user-select: none; touch-action: none; }
body.idle { cursor: none; }
img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
img.on { display: block; }
.black { position: fixed; inset: 0; background: #000; display: none; }
body.dark .black { display: block; }
</style>
</head>
<body>
<img src="slides/01.jpg" alt="Афиша культурных событий Башкортостана" draggable="false">
<img src="slides/02.jpg" alt="Поиск и фильтры" draggable="false">
<img src="slides/03.jpg" alt="Карточка и паспорт события" draggable="false">
<img src="slides/04.jpg" alt="ИИ-гид" draggable="false">
<img src="slides/05.jpg" alt="Telegram-бот и Mini App" draggable="false">
<img src="slides/06.jpg" alt="Районы и башкирский язык" draggable="false">
<img src="slides/07.jpg" alt="«Пульс культуры» для министерства" draggable="false">
<img src="slides/08.jpg" alt="Импорт и кабинет учреждения" draggable="false">
<img src="slides/09.jpg" alt="Открытый API и виджет" draggable="false">
<img src="slides/10.jpg" alt="Афиша РБ" draggable="false">
<div class="black"></div>
<script>
const slides = [...document.querySelectorAll("img")];
let cur = 0;
function show(n) {
  cur = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle("on", i === cur));
  history.replaceState(null, "", "#" + (cur + 1));
}
const next = () => show(cur + 1);
const prev = () => show(cur - 1);
function fullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) next();
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) prev();
  else if (k === "Home") show(0);
  else if (k === "End") show(slides.length - 1);
  else if (k === "f" || k === "F" || k === "а" || k === "А") fullscreen();
  else if (k === "b" || k === "B" || k === "и" || k === "И" || k === ".") document.body.classList.toggle("dark");
  else return;
  e.preventDefault();
});
document.addEventListener("click", (e) => (e.clientX < innerWidth / 3 ? prev() : next()));
let x0 = null;
document.addEventListener("touchstart", (e) => (x0 = e.touches[0].clientX), { passive: true });
document.addEventListener("touchend", (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) (dx < 0 ? next : prev)();
  x0 = null;
});
let idle;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("idle");
  clearTimeout(idle);
  idle = setTimeout(() => document.body.classList.add("idle"), 1500);
});
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
</html>
