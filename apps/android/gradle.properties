# Ограничения машины разработки: 8 ГБ ОЗУ, параллельно работают Docker и другие сборки.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.code.style=official

# Системная Java слишком новая для AGP — собираем JBR из Android Studio (JDK 21).
# На CI переопределяется через JAVA_HOME / -Dorg.gradle.java.home.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true

# Base URL API. С эмулятора localhost хоста — это 10.0.2.2.
# Переопределение: ./gradlew assembleDebug -Pafisha.apiBaseUrl=https://api.example.ru
afisha.apiBaseUrl=http://10.0.2.2:8000
