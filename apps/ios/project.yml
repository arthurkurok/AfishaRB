# XcodeGen: воспроизводимый проект iOS-приложения «Афиша РБ · Культура Башкортостана».
# Сгенерировать: `xcodegen generate` (или `make project`). Afisha.xcodeproj в git не хранится.
name: Afisha

options:
  bundleIdPrefix: ru.afisharb
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # Адрес API: для симулятора — локальный бэкенд; в релизе переопределяется в конфигурации CI
    AFISHA_API_BASE_URL: "http://localhost:8000"
  configs:
    Release:
      AFISHA_API_BASE_URL: "https://api.afisharb.ru"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  AfishaKit:
    path: AfishaKit

targets:
  Afisha:
    type: application
    platform: iOS
    sources:
      - path: Afisha
        excludes:
          - "**/*.md"
    dependencies:
      - package: AfishaKit
        product: AfishaKit
      - target: AfishaWidgets
        embed: true
        codeSign: true
    entitlements:
      path: Afisha/Afisha.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.afisharb.app
        com.apple.developer.associated-domains:
          - applinks:afisharb.ru
    info:
      path: Afisha/Info.plist
      properties:
        CFBundleDisplayName: Афиша РБ
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, ba]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        AfishaAPIBaseURL: $(AFISHA_API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: ru.afisharb.app
            CFBundleURLSchemes: [afisha]
        LSApplicationQueriesSchemes: [yandexmaps, dgis]
        NSLocationWhenInUseUsageDescription: Геопозиция нужна, чтобы показать события рядом с вами. Мы не храним её на сервере.
        NSCalendarsWriteOnlyAccessUsageDescription: Чтобы добавить выбранное событие в ваш календарь.
        NSAppTransportSecurity:
          # Только локальная сеть (localhost в симуляторе); продуктовый API — по HTTPS
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSUserActivityTypes: [WhereToGoTodayIntent, AskGuideIntent, OpenEventIntent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.afisharb.app
        PRODUCT_NAME: Afisha
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        ENABLE_PREVIEWS: YES

  AfishaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AfishaWidgets
    dependencies:
      - package: AfishaKit
        product: AfishaKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: AfishaWidgets/AfishaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.afisharb.app
    info:
      path: AfishaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Афиша РБ
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, ba]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AfishaAPIBaseURL: $(AFISHA_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.afisharb.app.widgets
        PRODUCT_NAME: AfishaWidgets
        SKIP_INSTALL: YES

schemes:
  Afisha:
    build:
      targets:
        Afisha: all
        AfishaWidgets: all
    run:
      config: Debug
    archive:
      config: Release
